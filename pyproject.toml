[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zodiac-v2"
version = "0.1.0"
description = "Modular zodiac site scraper"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "playwright>=1.61,<2"]

[project.scripts]
zodiac-v2 = "zodiac_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
