name: Codex fix export
on:
  push:
    branches: [codex/fix-cache-browser-bounds-20260909]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: yixiao-fix-worktree
          retention-days: 1
          if-no-files-found: error
          path: |
            src
            tests
            pyproject.toml
            sites.json
            recent_10_cache.json
            archived_sites.json
            .github/workflows/review-validation.yml
