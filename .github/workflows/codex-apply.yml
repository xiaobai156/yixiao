name: Codex apply final hardening
on:
  push:
    branches: [codex/yixiao-final-hardening-20260909]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage final hardening patch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Rebuild and apply verified patch
        shell: bash
        run: |
          cat .codex/patch.b64.* | base64 -d | python -c 'import sys,zlib; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > /tmp/final-hardening.patch
          git apply --check /tmp/final-hardening.patch
          git apply /tmp/final-hardening.patch
          git restore -- .github/workflows/review-validation.yml
      - name: Remove tracked runtime artifacts
        shell: bash
        run: |
          git rm -rf --ignore-unmatch .diagnostics .coverage recent_10_cache.json.lock
          git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$)' | xargs -r git rm -f --
      - name: Validate source and regressions
        shell: bash
        run: |
          python -m compileall -q src tests
          python -m ruff check src tests --select E9,F63,F7,F82
          python -m pytest -q
          python -c "from pathlib import Path; from zodiac_v2.cli import _runtime; sites, _ = _runtime(Path('sites.json')); assert len(sites) == 552; print('VALID_CONFIG_SITES', len(sites))"
          git diff --exit-code -- sites.json recent_10_cache.json archived_sites.json
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -rf .codex
          git add -A
          git commit -m "fix: harden source identity and formal update boundaries"
          git push origin HEAD:codex/yixiao-final-hardening-20260909
