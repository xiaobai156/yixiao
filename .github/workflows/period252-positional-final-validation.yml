name: Period 252 positional final validation

on:
  push:
    branches:
      - codex/period252-positional-final-validation-20260909

permissions:
  contents: read

jobs:
  crawl:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run 252 read-only with production profile
        shell: pwsh
        run: |
          python -m zodiac_v2.cli single --period 252 --timeout 60 --workers 8 2>&1 | Tee-Object -FilePath period252-final.log
          exit $LASTEXITCODE
      - name: Confirm production files unchanged
        run: git diff --exit-code -- sites.json recent_10_cache.json archived_sites.json
      - uses: actions/upload-artifact@v4
        with:
          name: period252-positional-final-log
          path: period252-final.log
          if-no-files-found: error
          retention-days: 1
