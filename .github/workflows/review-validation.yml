name: Review validation
on:
  push:
    branches: [codex/yixiao-review-fixes-20260909]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest requests playwright filelock
      - name: Inspect source configuration identities
        shell: python
        run: |
          import json
          from collections import defaultdict
          from pathlib import Path
          sites = json.loads(Path('sites.json').read_text(encoding='utf-8-sig'))
          groups = defaultdict(list)
          for site in sites:
              groups[site['url']].append((site['name'], site.get('article_keyword'), site['parser_id']))
          print('SITE_COUNT', len(sites))
          print('SHARED_URLS', [items for items in groups.values() if len(items) > 1])
      - name: Existing offline regression suite
        run: python -m pytest -q
