name: Period 252 system trust validation
on:
  push:
    branches: [codex/period252-system-trust-validation-20260909]
permissions:
  contents: read
jobs:
  crawl:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install chromium
      - name: Run 252 read-only with production profile
        shell: pwsh
        run: |
          python -X utf8 -m zodiac_v2.cli single --period 252 --workers 8 --timeout 60 2>&1 | Tee-Object -FilePath period252-system-trust.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm production files unchanged
        shell: pwsh
        run: git diff --exit-code -- sites.json recent_10_cache.json archived_sites.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period252-system-trust-log
          path: period252-system-trust.log
          retention-days: 1
