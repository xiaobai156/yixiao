name: Browser user API size fix validation

on:
  push:
    branches:
      - codex/browser-user-api-size-fix-20260909

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded API page size
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/zodiac_v2/source/api.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('per_page: int = 100') == 2
          path.write_text(text.replace('per_page: int = 100', 'per_page: int = 20'), encoding='utf-8')

          path = Path('src/zodiac_v2/services/scrape.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('per_page=100,') == 1
          path.write_text(text.replace('per_page=100,', 'per_page=20,'), encoding='utf-8')

          path = Path('tests/test_browser_user_direct_api.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('per_page=100') == 2
          path.write_text(text.replace('per_page=100', 'per_page=20'), encoding='utf-8')
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Fatal checks
        run: python -m ruff check src tests --select E9,F63,F7,F82
      - name: Full regression
        run: python -m pytest -q
      - name: Validate config
        shell: python
        run: |
          from pathlib import Path
          from zodiac_v2.cli import SOURCE_POLICIES
          from zodiac_v2.config import load_sites
          from zodiac_v2.parsers.registry import build_registry
          sites = load_sites(Path('sites.json'), parser_ids=build_registry().parser_ids, source_policies=SOURCE_POLICIES)
          assert len(sites) == 552
          print('VALID_CONFIG_SITES', len(sites))
      - name: Retest affected user sites 252 read-only
        shell: python
        run: |
          from pathlib import Path
          from zodiac_v2.cli import SOURCE_POLICIES
          from zodiac_v2.config import load_sites
          from zodiac_v2.contracts import RunMode
          from zodiac_v2.parsers.registry import build_registry
          from zodiac_v2.services.scrape import DefaultSourceGateway, ScrapeService
          registry = build_registry()
          sites = load_sites(Path('sites.json'), parser_ids=registry.parser_ids, source_policies=SOURCE_POLICIES)
          selected = tuple(site for site in sites if site.name in {'不幸风','体贴公园','清爽凯蒂'})
          service = ScrapeService(DefaultSourceGateway(), registry)
          results = service.scrape_sites(selected, 252, RunMode.READ_ONLY, timeout=60, workers=2)
          for result in results:
              print('RETEST', result.site.name, 'OK' if result.ok else 'FAIL', result.candidate.zodiac if result.ok else result.failure_code.value, '' if result.ok else result.reason)
          assert len(results) == 3
          assert all(result.ok for result in results)
      - name: Confirm production files unchanged
        run: git diff --exit-code -- sites.json recent_10_cache.json archived_sites.json
      - name: Commit validated files
        shell: pwsh
        run: |
          git config user.name "xiaobai156"
          git config user.email "234583912@qq.com"
          git add src/zodiac_v2/source/api.py src/zodiac_v2/services/scrape.py tests/test_browser_user_direct_api.py
          git commit -m "fix: bound direct user forum API fetch size"
          git push origin HEAD:${{ github.ref_name }}
