name: Codex cache browser fix
on:
  push:
    branches: [codex/fix-cache-browser-bounds-20260909]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: contains(github.event.head_commit.message, 'stage cache browser fix run')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Apply bounded fix patch
        shell: bash
        run: |
          cat .codex/cache-browser-fix.b64.* | base64 -d | python -c 'import sys,zlib; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > /tmp/fix.patch
          echo 'e72d37e166ed27375dcd7e4cad67cb9d8bf8c6897d48c7ff07b67d84c4f5bbb7  /tmp/fix.patch' | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
      - name: Validate
        shell: bash
        run: |
          python -m compileall -q src tests
          python -m ruff check src tests --select E9,F63,F7,F82
          python -m pytest -q
          python -c "from pathlib import Path; from zodiac_v2.cli import _runtime; sites, _ = _runtime(Path('sites.json')); assert len(sites) == 552; print('VALID_CONFIG_SITES', len(sites))"
          git diff --exit-code -- sites.json recent_10_cache.json archived_sites.json
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -rf .codex
          git add -A
          git commit -m "fix: surface cache failures and stream browser JSON bounds"
          git push origin HEAD:codex/fix-cache-browser-bounds-20260909
