name: Codex cache browser verify
on:
  push:
    branches: [codex/fix-cache-browser-bounds-20260909]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q src tests
      - run: python -m ruff check src tests --select E9,F63,F7,F82
      - run: python -m pytest -q
      - run: python -c "from pathlib import Path; from zodiac_v2.cli import _runtime; sites, _ = _runtime(Path('sites.json')); assert len(sites) == 552; print('VALID_CONFIG_SITES', len(sites))"
      - run: git diff --exit-code -- sites.json recent_10_cache.json archived_sites.json
